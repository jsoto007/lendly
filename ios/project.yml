name: Lendly
options:
  bundleIdPrefix: com.sotodev
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TZZNAY63L5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Lendly:
    type: application
    platform: iOS
    sources:
      - path: Lendly
    entitlements:
      path: Lendly/Lendly.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Lendly/Info.plist
      properties:
        CFBundleDisplayName: Lendly
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations: [en, es]
        CFBundleURLTypes:
          - CFBundleURLName: com.sotodev.lendly
            CFBundleURLSchemes: [lendly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sotodev.lendly
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SUPPORTS_MACCATALYST: NO
  LendlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LendlyTests
    dependencies:
      - target: Lendly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sotodev.lendly.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lendly:
    build:
      targets:
        Lendly: all
        LendlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LendlyTests]
