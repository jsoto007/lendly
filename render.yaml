# Render Blueprint for the Lendly API. The iOS app is built with Xcode and ships via TestFlight.
services:
  - type: web
    name: lendly-api
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi.py db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: lendly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APPLE_BUNDLE_ID
        value: com.sotodev.lendly
      - key: DEV_RETURN_OTP
        value: "false"
      - key: INVITE_LINK_BASE
        value: lendly://invite

databases:
  - name: lendly-db
    plan: basic-256mb
    databaseName: lendly
    user: lendly
